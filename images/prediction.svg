<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="330" viewBox="0 0 1020 330" role="img" aria-labelledby="title desc">
  <title id="title">How next-word ranking combines recent context</title>
  <desc id="desc">The last three words in a prompt look up separate memories in t2. Their weighted vectors are added into one query vector, which is compared with vocabulary vectors to rank candidates.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#596b82"/></marker>
    <style>.box{rx:14;stroke-width:2}.head{font:700 17px system-ui,sans-serif;fill:#17243a}.body{font:14px system-ui,sans-serif;fill:#33445c}.note{font:12px system-ui,sans-serif;fill:#586b82}.arrow{stroke:#596b82;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1020" height="330" rx="22" fill="#f7f9fc"/><text x="510" y="36" text-anchor="middle" class="head" font-size="21">One prompt becomes a weighted similarity search</text>
  <rect x="28" y="66" width="238" height="70" class="box" fill="#e8f3ff" stroke="#78aee8"/><text x="147" y="94" text-anchor="middle" class="head">Prompt ending</text><text x="147" y="119" text-anchor="middle" class="body">… fluffy ragdoll cat</text>
  <path class="arrow" d="M147 140 V164 H190 V180"/><path class="arrow" d="M147 140 V163 H510 V180"/><path class="arrow" d="M147 140 V164 H830 V180"/>
  <rect x="54" y="184" width="270" height="65" class="box" fill="#e9f8f0" stroke="#75c39a"/><text x="189" y="208" text-anchor="middle" class="head">t2[(1, "cat")] × 1</text><text x="189" y="232" text-anchor="middle" class="note">closest context gets most weight</text>
  <rect x="375" y="184" width="270" height="65" class="box" fill="#fff4df" stroke="#e4b65d"/><text x="510" y="208" text-anchor="middle" class="head">t2[(2, "ragdoll")] × 1/2</text><text x="510" y="232" text-anchor="middle" class="note">second-closest context</text>
  <rect x="696" y="184" width="270" height="65" class="box" fill="#f3edff" stroke="#ad91df"/><text x="831" y="208" text-anchor="middle" class="head">t2[(3, "fluffy")] × 1/3</text><text x="831" y="232" text-anchor="middle" class="note">third-closest context</text>
  <path class="arrow" d="M189 253 V273 H510"/><path class="arrow" d="M510 253 V273"/><path class="arrow" d="M831 253 V273 H510"/>
  <rect x="355" y="278" width="310" height="40" class="box" fill="#ffecef" stroke="#e3919c"/><text x="510" y="304" text-anchor="middle" class="head">combined query → compare with vocabulary → ranked words</text>
</svg>
